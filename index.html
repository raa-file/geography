<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدراسات الاجتماعية · أول متوسط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A44;--muted:#6B7280;--line:#E5E7EB;--bg:#F7F5F0;--card:#fff;--ok:#0F766E;--ok-soft:#E6F2F0;--bad:#B42318;--bad-soft:#FBEAE8;--accent:#0F766E}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button{font-family:inherit;cursor:pointer}
header{background:var(--ink);color:#fff;padding:48px 16px 40px;text-align:center;border-bottom:6px solid var(--ok)}
header h1{margin:0;font-size:clamp(30px,6vw,46px);font-weight:800}
header .sub{color:#D1D5DB;margin-top:6px}
header .tag{color:#99F6E4;font-weight:700;margin-top:14px}
.teacher{text-align:center;margin:28px 0 8px}
.teacher small{color:var(--muted);display:block}
.teacher b{font-size:24px;font-weight:800}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 60px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;font-weight:700;font-size:15px;color:var(--ink)}
.tab.on{color:#fff;border-color:transparent}
.unit-head{border-radius:16px;color:#fff;padding:22px 24px;margin-bottom:14px}
.unit-head small{opacity:.85}
.unit-head h2{margin:2px 0 0;font-size:28px;font-weight:800}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th{background:var(--ink);color:#fff;font-weight:700;padding:12px;font-size:14px}
td{padding:14px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:nth-child(even) td{background:#FAFAF9}
.num{width:56px;text-align:center}
.num span{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;color:#fff;font-weight:800}
.ttl{font-weight:700}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid;white-space:nowrap}
.btn.v{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
.btn.w{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)}
.done{font-size:12px;color:var(--ok);font-weight:700;display:block;text-align:center;margin-top:4px}
.note{color:var(--muted);font-size:13px;margin-top:12px}
@media (max-width:640px){
 thead{display:none} table,tbody,tr,td{display:block;width:100%}
 tr{border-top:1px solid var(--line);padding:10px 4px} td{border:0;padding:4px 10px}
 .num{width:auto;text-align:right}
}
/* worksheet */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:10}
.overlay.open{display:flex}
.sheet{background:#fff;border-radius:18px;max-width:720px;width:100%;overflow:hidden}
.sheet-h{color:#fff;padding:20px 24px;position:relative}
.sheet-h small{opacity:.85}
.sheet-h h3{margin:4px 0 0;font-size:24px;font-weight:800}
.x{position:absolute;left:16px;top:16px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:20px}
.sheet-b{padding:20px 24px 28px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row label{flex:1;min-width:180px;font-weight:700;font-size:14px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:15px;background:#FAFAF9;margin-top:4px}
.qh{background:var(--ok-soft);border-radius:10px;padding:8px 14px;font-weight:800;margin:22px 0 10px}
.q{margin:10px 0 14px;padding:10px 12px;border-radius:12px;border:1.5px solid transparent}
.q.right{border-color:var(--ok);background:var(--ok-soft)}
.q.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q p{margin:0 0 8px;font-weight:700}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-size:15px}
.opt.sel{color:#fff;border-color:transparent}
.actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.cta{border:0;color:#fff;border-radius:999px;padding:11px 26px;font-weight:800;font-size:16px}
.ghost{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 20px;font-weight:700}
.result{text-align:center;font-weight:800;font-size:18px;margin-top:16px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media print{header,.tabs,.wrap>*:not(.overlay),footer{display:none}.overlay{position:static;background:none;display:block;padding:0}.x,.actions{display:none}}
</style>
</head>

</div>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<footer>إعداد المعلمة: رهف المقاطي</footer>

const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

 const u=DATA[cur];

  ${l.tf.map((t,k)=>q('t'+k,AR(k+1)+'. '+t[0],['صح','خطأ'])).join('')}

  <div class="qh" style="color:${u.color}">السؤال الثالث: اكتبي أهم معلومة تعلّمتِها من الفيديو</div>

  </div>
  <div class="result" id="res"></div>
 </div>`;
 Object.keys(ans).forEach(k=>{if(k!='open')mark(k,ans[k])});

}
function mark(id,k){document.querySelectorAll(`.opt[data-q="${id}"]`).forEach(b=>{const on=+b.dataset.k===k;b.classList.toggle('sel',on);b.style.background=on?ws.u.color:''})}
function pick(id,k){ans[id]=k;mark(id,k);document.getElementById('q_'+id).classList.remove('right','wrong');save()}
function save(){ans.open=document.getElementById('op')?.value||'';store.set('ans'+ws.l.n,ans);store.set('name',document.getElementById('nm').value);store.set('cls',document.getElementById('cl').value)}
function check(){
 save();const l=ws.l;let sc=0,tot=0,empty=0;
 l.tf.forEach((t,k)=>{tot++;const a=ans['t'+k],el=document.getElementById('q_t'+k);el.classList.remove('right','wrong');if(a==null){empty++;return}const ok=(a===0)===t[1];if(ok)sc++;el.classList.add(ok?'right':'wrong')});
 l.mc.forEach((m,k)=>{tot++;const a=ans['m'+k],el=document.getElementById('q_m'+k);el.classList.remove('right','wrong');if(a==null){empty++;return}const ok=a===m[2];if(ok)sc++;el.classList.add(ok?'right':'wrong')});
 const r=document.getElementById('res');
 r.style.color=sc==tot?'var(--ok)':'var(--ink)';
 r.textContent=(empty?`بقي ${AR(empty)} سؤال بدون إجابة · `:'')+`درجتك ${AR(sc)} من ${AR(tot)}`+(sc==tot?' — أحسنتِ! 🌟':'');
 if(!empty){store.set('res'+l.n,[sc,tot]);renderUnit();}
}
function resetWS(){ans={};store.set('ans'+ws.l.n,ans);openWS(ws.l.n)}
function closeWS(){if(ws)save();document.getElementById('ov').classList.remove('open');document.body.style.overflow=''}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id=='ov')closeWS()});
